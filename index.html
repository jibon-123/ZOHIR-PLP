<style>

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Hind Siguri','Noto Sans Bengali',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding-bottom:84px}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}

.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tcard{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.07);cursor:pointer;position:relative;transition:transform .15s}
.tcard:active{transform:scale(.97)}
.tcard canvas{width:100%;display:block;background:#ddd}
.tcard .nm{padding:9px 12px;font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.lock{position:absolute;top:8px;left:8px;background:var(--gold);color:#3b2a00;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px}
.free{position:absolute;top:8px;left:8px;background:rgba(15,107,58,.92);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px}
.editor{display:grid;gap:16px}
@media(min-width:900px){.editor{grid-template-columns:minmax(0,1fr) 430px;align-items:start}.prev{position:sticky;top:76px}}
.prev,.panel{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.07)}

.hint{font-size:12px;color:var(--mut);margin-top:4px}
.row{display:flex;gap:10px}.row>*{flex:1}
.btn{border:0;font:inherit;font-weight:700;font-size:15px;padding:13px 16px;border-radius:14px;cursor:pointer;background:var(--g);color:#fff;width:100%}
.btn.o{background:#fff;color:var(--g);border:2px solid var(--g)}
.btn.gold{background:var(--gold);color:#3b2a00}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px;width:auto}
.btn.red{background:#c0392b}

.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:10px;font:inherit;cursor:pointer}
.seg button.on{background:var(--g);color:#fff}
.back{background:none;border:0;font:inherit;color:var(--g);font-weight:700;cursor:pointer;margin-bottom:10px;font-size:15px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}

.hist{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.hcard{background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.07)}

.hcard .m{padding:8px 10px;font-size:12px;color:var(--mut)}
.hcard .b{display:flex;gap:6px;padding:0 10px 10px}

.pro{background:linear-gradient(160deg,#1d1a10,#3a2c06);color:#fff;border-radius:22px;padding:24px;text-align:center}
.pro .pr{font-size:48px;font-weight:800;color:var(--gold)}
.pro ul{list-style:none;text-align:left;max-width:340px;margin:16px auto;line-height:2}

.steps{background:#fff;border-radius:var(--r);padding:16px;margin-top:14px;line-height:1.9;font-size:14px}
.steps code{background:#eef3ee;padding:2px 8px;border-radius:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:22px;padding:22px;max-width:380px;width:100%;text-align:center}
.mbox h3{margin-bottom:8px}.mbox p{color:var(--mut);margin-bottom:16px;font-size:14px}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;z-index:60;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
</style>

<script>
/* ============ কনফিগ — এখানে নিজের তথ্য বসান ============ */

  // নিজের ছবির টেমপ্লেট যোগ করতে (README দেখুন):

/* ============ হেল্পার ============ */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const FH=104;
const F=s=>`"${s.font}",'Noto Sans Bengali',sans-serif`;
function rr(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}
function tint(c,x,y,w,h,col,a){c.save();c.globalAlpha=a;c.fillStyle=col;c.fillRect(x,y,w,h);c.restore()}
function cover(c,img,x,y,w,h,col){
  if(!img){const g=c.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,col||'#5a7a6a');g.addColorStop(1,'#1d2b24');c.fillStyle=g;c.fillRect(x,y,w,h);
    c.save();c.globalAlpha=.12;c.fillStyle='#fff';for(let i=0;i<7;i++){c.beginPath();c.arc(x+w*(i/6),y+h*(.3+.4*((i*37)%10)/10),60+i*14,0,7);c.fill()}c.restore();return}
  const r=Math.max(w/img.width,h/img.height),iw=w/r,ih=h/r;
  c.drawImage(img,(img.width-iw)/2,(img.height-ih)/2,iw,ih,x,y,w,h)}
function pattern(c,W,H,col,a){c.save();c.strokeStyle=col;c.globalAlpha=a;c.lineWidth=2;c.beginPath();c.rect(0,0,W,H);c.clip();
  for(let y=0;y<H;y+=96)for(let x=0;x<W;x+=96){c.beginPath();c.moveTo(x+48,y);c.lineTo(x+96,y+48);c.lineTo(x+48,y+96);c.lineTo(x,y+48);c.closePath();c.stroke();c.beginPath();c.arc(x+48,y+48,24,0,7);c.stroke()}c.restore()}
function dots(c,W,H,col,a,gap){c.save();c.fillStyle=col;c.globalAlpha=a;for(let y=gap/2;y<H;y+=gap)for(let x=gap/2;x<W;x+=gap){c.beginPath();c.arc(x,y,3,0,7);c.fill()}c.restore()}
function gridBg(c,W,H,col,a,gap){c.save();c.strokeStyle=col;c.globalAlpha=a;c.lineWidth=2;for(let x=0;x<=W;x+=gap){c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke()}for(let y=0;y<=H;y+=gap){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}c.restore()}
function glyph(c,x,y,size,col,align){c.save();c.fillStyle=col;c.textAlign=align||'left';c.textBaseline='alphabetic';c.font=`900 ${size}px Georgia,serif`;c.fillText('\u201C',x,y);c.restore()}
function txt(c,s,t,x,y,size,col,o={}){if(!t)return;c.save();c.fillStyle=col;c.font=`${o.weight||600} ${size}px ${F(s)}`;c.textAlign=o.align||'left';c.textBaseline='middle';if(o.shadow){c.shadowColor=o.shadow;c.shadowBlur=22}c.fillText(t,x,y);c.restore()}
function pill(c,s,t,cx,y,size,bg,fg){if(!t)return;c.save();c.font=`600 ${size}px ${F(s)}`;const w=c.measureText(t).width+60,h=size*1.9;c.fillStyle=bg;c.fillRect(cx-w/2,y,w,h);c.fillStyle=fg;c.textAlign='center';c.textBaseline='middle';c.fillText(t,cx,y+h/2+2);c.restore()}

function parse(t){return t.split('\n').map(l=>{const o=[];l.split('*').forEach((seg,i)=>seg.split(/\s+/).filter(Boolean).forEach(w=>o.push({w,hl:i%2===1})));return o})}
function layout(c,text,o){c.font=`${o.weight} ${o.size}px ${o.font}`;const sp=c.measureText(' ').width,lines=[];
  parse(text).forEach(par=>{if(!par.length){lines.push({runs:[],width:0});return}let cur=[],cw=0;
    par.forEach(t=>{const w=c.measureText(t.w).width;if(cur.length&&cw+sp+w>o.w){lines.push({runs:cur,width:cw});cur=[];cw=0}cw+=(cur.length?sp:0)+w;cur.push({...t,width:w})});
    lines.push({runs:cur,width:cw})});return{lines,sp}}
function block(c,s,text,o){
  if(!text)return{bottom:o.y,size:0};
  const f=F(s),lh=o.lh||1.4,wt=o.weight||700;let size=o.size*(o.noScale?1:s.sizeMul),L;
  for(;;){L=layout(c,text,{size,w:o.w,font:f,weight:wt});if(L.lines.length*size*lh<=o.h||size<=(o.min||24))break;size-=3}
  const total=L.lines.length*size*lh;let y=o.y+(o.valign==='top'?0:Math.max(0,(o.h-total)/2));
  c.save();c.textBaseline='middle';c.textAlign='left';c.font=`${wt} ${size}px ${f}`;
  for(const ln of L.lines){let x=o.align==='left'?o.x:o.align==='right'?o.x+o.w-ln.width:o.x+(o.w-ln.width)/2;const cy=y+size*lh/2;
    for(const r of ln.runs){
      if(r.hl&&o.mode==='bg'){c.fillStyle=o.accent;c.fillRect(x-8,cy-size*.64,r.width+16,size*1.28);c.fillStyle=o.hlColor||'#111'}
      else c.fillStyle=r.hl?o.accent:o.color;
      if(o.shadow){c.shadowColor=o.shadow;c.shadowBlur=26}
      c.fillText(r.w,x,cy);c.shadowBlur=0;x+=r.width+L.sp}
    y+=size*lh}
  c.restore();return{bottom:y,size}}
function footer(c,W,H,s,st){
  if(!s.showFooter)return;const y=H-FH,d=64,cx=44+d/2,cy=y+FH/2;
  c.fillStyle=st.bg;c.fillRect(0,y,W,FH);
  c.save();c.beginPath();c.arc(cx,cy,d/2,0,7);c.closePath();
  if(s.logo){c.clip();cover(c,s.logo,cx-d/2,cy-d/2,d,d);c.restore()}
  else{c.fillStyle=s.accent;c.fill();c.restore();txt(c,s,(s.tag||s.author||'ক').trim().charAt(0).toUpperCase(),cx,cy+2,34,'#fff',{align:'center',weight:800})}
  txt(c,s,s.tag,cx+d/2+18,cy,32,st.fg,{weight:700});
  txt(c,s,s.contact,W-44,cy,28,st.fg,{align:'right'})}

/* ============ টেমপ্লেট ডিজাইন ============ */
function quoteTop(c,W,H,s){
  const fh=s.showFooter?FH:0,area=H-fh,topH=Math.round(area*.5),ac=s.accent;
  c.fillStyle='#fdfcf6';c.fillRect(0,0,W,H);pattern(c,W,topH,'#c9c3a8',.4);
  c.fillStyle=ac;rr(c,W/2-68,0,136,124,[0,0,34,34]);c.fill();glyph(c,W/2,112,150,'#fff','center');
  txt(c,s,s.title,W/2,160,34,ac,{align:'center',weight:700});
  block(c,s,s.text,{x:70,y:190,w:W-140,h:topH-190-(s.author?120:50),size:82,align:'center',color:'#111',accent:ac,font:0,weight:800,lh:1.38});
  pill(c,s,s.author,W/2,topH-112,34,ac,'#fff');
  cover(c,s.photo,0,topH,W,area-topH,ac);tint(c,0,topH,W,area-topH,ac,.5);
  c.fillStyle=ac;c.globalAlpha=.6;c.fillRect(0,topH,W,5);c.globalAlpha=1;
  if(s.caption)txt(c,s,s.caption,W/2,topH+60,34,'#fff',{align:'center',shadow:'#000'});
  footer(c,W,H,s,{bg:'rgba(0,0,0,.6)',fg:'#fff'})}
function darkPhoto(c,W,H,s){
  const fh=s.showFooter?FH:0,A=H-fh,ac=s.accent;
  cover(c,s.photo,0,0,W,H,'#1d3a24');tint(c,0,0,W,H,'#000',.62);
  const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(0,0,0,.4)');g.addColorStop(1,'rgba(0,0,0,.2)');c.fillStyle=g;c.fillRect(0,0,W,H);
  block(c,s,s.title,{x:60,y:A*.2,w:W-120,h:A*.18,size:170,align:'center',color:ac,accent:'#fff',font:0,weight:800,lh:1.1,shadow:'rgba(0,0,0,.5)'});
  block(c,s,s.caption,{x:60,y:A*.39,w:W-120,h:A*.1,size:78,align:'center',color:'#fff',accent:ac,weight:700,lh:1.2});
  c.fillStyle='rgba(60,80,25,.62)';rr(c,70,A*.52,W-140,A*.33,52);c.fill();
  block(c,s,s.text,{x:110,y:A*.52+20,w:W-220,h:A*.33-40,size:46,align:'center',color:'#fff',accent:ac,weight:500,lh:1.5});
  c.fillStyle='#fff';for(let i=0;i<5;i++){c.beginPath();c.arc(W/2-60+i*30,A*.89,9,0,7);c.fill()}
  txt(c,s,s.author,W/2,A*.945,34,'rgba(255,255,255,.75)',{align:'center'});
  footer(c,W,H,s,{bg:'rgba(0,0,0,.55)',fg:'#fff'})}
function paperPhoto(c,W,H,s){
  const fh=s.showFooter?FH:0,A=H-fh,topH=Math.round(A*.52),ac=s.accent,paper='#e6e6e4';
  c.fillStyle=paper;c.fillRect(0,0,W,H);dots(c,W,topH,'#bbb',.35,24);
  c.fillStyle=ac;rr(c,W-210,60,130,130,26);c.fill();txt(c,s,(s.tag||s.title||'Z').trim().charAt(0).toUpperCase(),W-145,128,76,'#fff',{align:'center',weight:800});
  txt(c,s,s.title,W-145,230,40,ac,{align:'center',weight:800});
  glyph(c,100,380,210,'#4a4a4a');
  block(c,s,s.text,{x:100,y:340,w:W-200,h:topH-340-110,size:70,align:'left',color:'#111',accent:ac,weight:700,lh:1.35,valign:'top'});
  txt(c,s,s.author,100,topH-62,32,'#666',{weight:500});
  cover(c,s.photo,0,topH,W,A-topH,'#4b7a8a');tint(c,0,topH,W,A-topH,'#2a6f70',.12);
  c.fillStyle=paper;for(let x=0;x<W+130;x+=130){c.beginPath();c.arc(x+65,topH-2,62,0,Math.PI);c.fill()}c.fillRect(0,topH-30,W,28);
  footer(c,W,H,s,{bg:'rgba(0,0,0,.6)',fg:'#fff'})}
function splitSide(c,W,H,s){
  const fh=s.showFooter?FH:0,A=H-fh,ac=s.accent,sx=Math.round(W*.667);
  c.fillStyle='#fff';c.fillRect(0,0,W,H);
  if(s.photo){cover(c,s.photo,sx,0,W-sx,A);tint(c,sx,0,W-sx,A,ac,.88)}else{c.fillStyle=ac;c.fillRect(sx,0,W-sx,A)}
  c.fillStyle='rgba(255,255,255,.12)';c.beginPath();c.arc(sx+(W-sx)/2,A*.42,200,0,7);c.fill();
  txt(c,s,s.title,70,100,46,ac,{weight:800});txt(c,s,s.tag,70,152,28,'#777');
  c.fillStyle=ac;rr(c,W-360-sx+sx-0,0,0,0,0);
  glyph(c,70,420,220,ac);
  block(c,s,s.text,{x:70,y:400,w:sx-110,h:A-400-170,size:82,align:'left',color:'#444',accent:ac,weight:700,lh:1.4,valign:'top'});
  txt(c,s,s.author?'– '+s.author:'',70,A-100,34,ac,{weight:700});
  footer(c,W,H,s,{bg:ac,fg:'#fff'})}
function brownBanner(c,W,H,s){
  const fh=s.showFooter?FH:0,A=H-fh,ac=s.accent;
  c.fillStyle='#efece7';c.fillRect(0,0,W,H);
  for(let i=0;i<2600;i++){c.fillStyle=`rgba(0,0,0,${Math.random()*.035})`;c.fillRect(Math.random()*W,Math.random()*H,3,3)}

function render(canvas,s,outW){
  const H=Math.round(1080*s.ratio),k=outW/1080;canvas.width=outW;canvas.height=Math.round(H*k);
  const c=canvas.getContext('2d');c.setTransform(k,0,0,k,0,0);c.clearRect(0,0,1080,H);

function loadImg(src){return new Promise(r=>{if(!src)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
function readFile(file,max,type){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),cv=document.createElement('canvas');cv.width=Math.round(i.width*k);cv.height=Math.round(i.height*k);cv.getContext('2d').drawImage(i,0,0,cv.width,cv.height);res(cv.toDataURL(type,.82))};i.src=fr.result};fr.readAsDataURL(file)})}

  <div class="f"><label>লেখক / বক্তা</label><input type="text" data-k="author"></div>
  <div class="row"><div class="f"><label>ট্যাগ / পেজের নাম</label><input type="text" data-k="tag"></div><div class="f"><label>ফোন / যোগাযোগ</label><input type="text" data-k="contact"></div></div>
  <div class="f"><label>নিজের লোগো</label><label class="file"><input type="file" accept="image/*" id="logoF"><span class="btn o sm">লোগো বাছুন</span><span id="logoN">${S.logoData?'লোগো যোগ হয়েছে':''}</span></label></div>
  <div class="f"><label>ব্যাকগ্রাউন্ড / ফটো</label><label class="file"><input type="file" accept="image/*" id="photoF"><span class="btn o sm">ছবি বাছুন</span><span id="photoN">${S.photoData?'ছবি যোগ হয়েছে':''}</span></label></div>
  <div class="row"><div class="f"><label>রঙ</label><input type="color" data-k="accent" style="width:100%;height:44px;border:1.5px solid var(--line);border-radius:12px;padding:3px"></div>
  <div class="f"><label>ফন্ট</label><select data-k="font">${fonts.map(f=>`<option ${f===S.font?'selected':''}>${f}</option>`).join('')}</select></div></div>
  <div class="f"><label>লেখার সাইজ</label><input type="range" min="0.6" max="1.4" step="0.05" data-k="sizeMul" style="width:100%"></div>
  <div class="row"><div class="f"><label>সাইজ</label><div class="seg" id="ratioSeg"><button data-r="1" class="${S.ratio===1?'on':''}">১:১</button><button data-r="1.25" class="${S.ratio===1.25?'on':''}">৪:৫</button></div></div>
  <div class="f"><label>নিচের স্ট্রিপ</label><div class="seg" id="ftSeg"><button data-f="1" class="${S.showFooter?'on':''}">দেখান</button><button data-f="0" class="${!S.showFooter?'on':''}">লুকান</button></div></div></div>
  ${t.pro&&!isPro()?'<div class="hint" style="margin-bottom:10px">🔒 এটি প্রো ডিজাইন — এডিট করে দেখা যাবে, ডাউনলোডে প্রো লাগবে।</div>':''}
  <div class="row"><button class="btn" id="dlN">⬇ নরমাল ডাউনলোড</button><button class="btn gold" id="dlH">⬇ HD ডাউনলোড</button></div>
  <div class="hint" style="text-align:center;margin-top:8px">দুটোই সম্পূর্ণ ফ্রি • নরমাল: ৭২০px • HD: ২১৬০px</div>`;
  $$('#panel [data-k]').forEach(el=>{const k=el.dataset.k;el.value=S[k];el.oninput=()=>{S[k]=k==='sizeMul'?+el.value:el.value;rerender()}});
  $('#logoF').onchange=async e=>{const f=e.target.files[0];if(!f)return;S.logoData=await readFile(f,300,'image/png');S.logo=await loadImg(S.logoData);$('#logoN').textContent=f.name;rerender()};
  $('#photoF').onchange=async e=>{const f=e.target.files[0];if(!f)return;S.photoData=await readFile(f,1100,'image/jpeg');S.photo=await loadImg(S.photoData);$('#photoN').textContent=f.name;rerender()};
  $$('#ratioSeg button').forEach(b=>b.onclick=()=>{S.ratio=+b.dataset.r;$$('#ratioSeg button').forEach(x=>x.classList.toggle('on',x===b));rerender()});
  $$('#ftSeg button').forEach(b=>b.onclick=()=>{S.showFooter=b.dataset.f==='1';$$('#ftSeg button').forEach(x=>x.classList.toggle('on',x===b));rerender()});
  $('#dlN').onclick=()=>download(false);$('#dlH').onclick=()=>download(true)}

function download(hd){
  const t=tplById(S.tpl);if(t.pro&&!isPro()){$('#mPrice').textContent=CFG.price;$('#modal').classList.add('on');return}
  const out=document.createElement('canvas');render(out,S,hd?2160:720);
  out.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`card-${Date.now()}.${hd?'png':'jpg'}`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)},hd?'image/png':'image/jpeg',.9);
  saveHistory();toast(hd?'HD ছবি ডাউনলোড হচ্ছে ✔':'ছবি ডাউনলোড হচ্ছে ✔')}
$('#mClose').onclick=()=>$('#modal').classList.remove('on');
$('#mGo').onclick=()=>{$('#modal').classList.remove('on');go('pro')};

function saveHistory(){
  const th=document.createElement('canvas');render(th,S,320);
  const {logo,photo,...rest}=S;
  let h=LS.get('cs_hist',[]);h.unshift({id:Date.now(),s:rest,thumb:th.toDataURL('image/jpeg',.7)});h=h.slice(0,24);
  while(h.length&&!LS.set('cs_hist',h))h.pop()}
function drawHist(){
  const h=LS.get('cs_hist',[]),box=$('#hlist');
  if(!h.length){box.innerHTML='<div class="empty">এখনো কোনো কার্ড বানানো হয়নি।<br>কার্ড ডাউনলোড করলে এখানে জমা হবে।</div>';return}
  box.innerHTML=`<p class="hint" style="margin-bottom:10px">মোট ${h.length}টি কার্ড বানানো হয়েছে</p><div class="hist">${h.map(e=>`<div class="hcard"><img src="${e.thumb}"><div class="m">${tplById(e.s.tpl)?.name||''} • ${new Date(e.id).toLocaleDateString('bn-BD')}</div><div class="b"><button class="btn sm" data-e="${e.id}">এডিট</button><button class="btn sm red" data-d="${e.id}">মুছুন</button></div></div>`).join('')}</div><div style="height:14px"></div><button class="btn o" id="clrH">সব হিস্টরি মুছুন</button>`;
  $$('[data-e]').forEach(b=>b.onclick=async()=>{const e=h.find(x=>x.id==b.dataset.e);const t=tplById(e.s.tpl);if(!t)return;const st={...e.s,logo:await loadImg(e.s.logoData),photo:await loadImg(e.s.photoData)};openEditor(t,st)});
  $$('[data-d]').forEach(b=>b.onclick=()=>{LS.set('cs_hist',h.filter(x=>x.id!=b.dataset.d));drawHist()});
  $('#clrH').onclick=()=>{if(confirm('সব হিস্টরি মুছে ফেলবেন?')){LS.set('cs_hist',[]);drawHist()}}}

function drawPro(){
  const p=isPro(),v=$('#v-pro');
  v.innerHTML=`<div class="pro"><div style="font-size:42px">👑</div><h2 style="margin:6px 0">প্রো প্ল্যান</h2><div class="pr">৳${CFG.price}</div><div>একবার দিন, সারা জীবন ব্যবহার করুন</div>
  <ul><li>সব আধুনিক প্রো ডিজাইন আনলক</li><li>নতুন ডিজাইন যোগ হলে ফ্রি আপডেট</li><li>নরমাল ও HD ডাউনলোড (ফ্রি ইউজারদের জন্যও ফ্রি)</li><li>লাইফটাইম — কোনো মাসিক খরচ নেই</li></ul>
  ${p?'<div class="btn gold" style="cursor:default">✔ আপনার প্রো সক্রিয় আছে</div>':'<div class="hint" style="color:#d9c98f">নিচের ধাপ অনুসরণ করুন</div>'}</div>
  ${p?'':`<div class="steps"><b>কিভাবে প্রো নেবেন:</b><br>১. ${CFG.payMethod} এ <code>${CFG.payNumber}</code> নম্বরে <b>${CFG.price} টাকা</b> পাঠান।<br>২. <a href="${CFG.contactLink}" target="_blank">এখানে ক্লিক করে</a> ট্রানজেকশন আইডি পাঠান।<br>৩. আমরা আপনাকে একটি প্রো কোড দেব — নিচে বসিয়ে আনলক করুন।
  <div class="f" style="margin-top:12px"><input type="text" id="code" placeholder="প্রো কোড লিখুন"></div><button class="btn gold" id="unlock">আনলক করুন</button></div>`}
  <div class="steps"><b>প্রো ডিজাইনগুলো:</b> ${TPL.filter(t=>t.pro).map(t=>t.name).join(' • ')}</div>`;
  const u=$('#unlock');if(u)u.onclick=()=>{const c=$('#code').value.trim().toUpperCase();if(CFG.proCodes.map(x=>x.toUpperCase()).includes(c)){LS.set('cs_pro',true);syncPro();toast('প্রো আনলক হয়েছে 🎉');drawPro()}else toast('কোডটি সঠিক নয়')}}
function syncPro(){$('#proBadge').classList.toggle('on',isPro());drawGrid()}

function drawProf(){
  const v=$('#v-prof');
  v.innerHTML=`<h2>আমার প্রোফাইল</h2><div class="panel"><p class="hint" style="margin-bottom:12px">এখানে একবার তথ্য দিলে প্রতিটি নতুন কার্ডে নিজে থেকে বসে যাবে।</p>
  <div class="f"><label>ডিফল্ট লেখক / নাম</label><input type="text" id="pa"></div>
  <div class="f"><label>ট্যাগ / পেজের নাম</label><input type="text" id="pt"></div>
  <div class="f"><label>ফোন / যোগাযোগ</label><input type="text" id="pc"></div>
  <div class="f"><label>লোগো</label><label class="file"><input type="file" accept="image/*" id="pl"><span class="btn o sm">লোগো বাছুন</span><span id="pln">${profile.logoData?'লোগো সেভ আছে':''}</span></label></div>
  <button class="btn" id="ps">সেভ করুন</button></div>
  <div class="steps" style="margin-top:14px">সব তথ্য শুধু আপনার ব্রাউজারেই থাকে, কোথাও আপলোড হয় না।</div>`;
  $('#pa').value=profile.author||'';$('#pt').value=profile.tag||'';$('#pc').value=profile.contact||'';
  $('#pl').onchange=async e=>{const f=e.target.files[0];if(!f)return;profile.logoData=await readFile(f,300,'image/png');$('#pln').textContent=f.name};
  $('#ps').onclick=()=>{profile.author=$('#pa').value;profile.tag=$('#pt').value;profile.contact=$('#pc').value;LS.set('cs_profile',profile);toast('প্রোফাইল সেভ হয়েছে ✔')}}

/* ============ শুরু ============ */
(async function init(){
  document.title=CFG.appName+' - ফটো কার্ড ও নিউজ কার্ড মেকার';$('#appName').textContent=CFG.appName;
  try{await Promise.all(['Hind Siguri','Anek Bangla','Baloo Da 2','Noto Serif Bengali','Tiro Bangla'].map(f=>document.fonts.load(`700 40px "${f}"`,'অআক')))}catch(e){}
  drawChips();syncPro();
})();
</script>
</body>
</html>
