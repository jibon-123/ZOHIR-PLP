<title>Zᴏʜɪʀ | PLP - ফটো কার্ড ও নিউজ কার্ড মেকার</title>

<style>
:root{--g:#0f6b3a;--g2:#0a4d2a;--bg:#f3f5f2;--card:#fff;--tx:#1b2420;--mut:#6b7770;--line:#e2e8e3;--gold:#e0a82e;--r:18px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#d9dfda;-webkit-text-size-adjust:100%}
body{font-family:'Hind Siguri','Noto Sans Bengali',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;min-height:100dvh;padding-bottom:calc(76px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto;box-shadow:0 0 40px rgba(0,0,0,.12);overflow-x:hidden}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:14px 18px;padding-top:calc(14px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between}
header h1{font-size:20px;font-weight:700;display:flex;gap:10px;align-items:center}
header .badge{background:var(--gold);color:#3b2a00;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;display:none}
header .badge.on{display:inline-block}
main{padding:14px}
.view{display:none}.view.on{display:block}
h2{font-size:18px;margin:6px 0 12px}
.chips{display:flex;gap:8px;margin-bottom:14px;overflow:auto}
.chip{border:1px solid var(--line);background:var(--card);padding:7px 16px;border-radius:99px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tcard{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.07);cursor:pointer;position:relative;transition:transform .15s}
.tcard:active{transform:scale(.97)}
.tcard canvas{width:100%;display:block;background:#ddd}
.tcard .nm{padding:9px 12px;font-size:14px;font-weight:600}
.lock{position:absolute;top:8px;left:8px;background:var(--gold);color:#3b2a00;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px}
.free{position:absolute;top:8px;left:8px;background:rgba(15,107,58,.92);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px}
.editor{display:grid;gap:16px}
/* এডিটর সবসময় মোবাইল লেআউটে: উপরে প্রিভিউ (স্টিকি), নিচে এডিট প্যানেল */
.prev{position:sticky;top:calc(56px + env(safe-area-inset-top));z-index:15;padding:10px;background:rgba(255,255,255,.97);backdrop-filter:blur(6px)}
.prev,.panel{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
#cv{width:auto;height:auto;max-width:100%;max-height:36vh;max-height:36dvh;margin:0 auto;border-radius:12px;display:block;box-shadow:0 4px 18px rgba(0,0,0,.15)}
.f{margin-bottom:12px}
.f>label{display:block;font-size:13px;color:var(--mut);margin-bottom:5px;font-weight:600}
.f input[type=text],.f textarea,.f select,.rt{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;font:inherit;font-size:16px;background:#fcfdfc}
.rt{min-height:120px;line-height:1.7;outline:none;white-space:pre-wrap;word-break:break-word}
.rt [data-hl]{background:#fff3b0;font-weight:700;border-radius:4px}
.f input:focus,.rt:focus,.f select:focus{outline:none;border-color:var(--g)}
.tb{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:8px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line);cursor:pointer;font-size:15px;line-height:1;color:#555;background:var(--card)}
.tb input[type=color],.cin{width:38px;height:34px;border:1.5px solid var(--line);border-radius:10px;padding:2px;background:var(--card);cursor:pointer}
.hint{font-size:12px;color:var(--mut);margin-top:5px}
.row{display:flex;gap:10px}.row>*{flex:1}
.btn{border:0;font:inherit;font-weight:700;font-size:15px;padding:13px 16px;border-radius:14px;cursor:pointer;background:var(--g);color:#fff;width:100%}
.btn.o{background:var(--card);color:var(--g);border:2px solid var(--g)}
.btn.gold{background:var(--gold);color:#3b2a00}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px;width:auto}
.btn.red{background:#c0392b}
.file{display:flex;align-items:center;gap:10px}
.file input{display:none}
.file span{font-size:13px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--card);padding:10px;font:inherit;cursor:pointer}
.seg button.on{background:var(--g);color:#fff}
.scn{display:flex;gap:8px;overflow:auto;padding:4px 2px 8px}
.scn button{flex:0 0 auto;border:2.5px solid transparent;border-radius:12px;background:var(--card);padding:0;cursor:pointer;overflow:hidden;font:inherit;font-size:11px;color:var(--mut);width:70px}
.scn button.on{border-color:var(--g)}
.scn canvas{display:block;width:100%}
.scn button.none{height:70px;display:flex;align-items:center;justify-content:center;border:1.5px dashed var(--line)}
.back{position:static;background:none;border:0;font:inherit;color:var(--g);font-weight:700;cursor:pointer;margin-bottom:10px;font-size:15px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:9px 0 8px;font:inherit;font-size:12px;color:var(--mut);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:21px}
nav button.on{color:var(--g);font-weight:700}
.hist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.hcard{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.hcard img{width:100%;display:block}
.hcard .m{padding:8px 10px;font-size:12px;color:var(--mut)}
.hcard .b{display:flex;gap:6px;padding:0 10px 10px}
.empty{text-align:center;color:var(--mut);padding:50px 10px}
.pro{background:linear-gradient(160deg,#1d1a10,#3a2c06);color:#fff;border-radius:22px;padding:24px;text-align:center}
.pro .pr{font-size:48px;font-weight:800;color:var(--gold)}
.pro ul{list-style:none;text-align:left;max-width:360px;margin:16px auto;line-height:2}
.pro ul li:before{content:"✔ ";color:var(--gold)}
.steps{background:var(--card);border-radius:var(--r);padding:16px;margin-top:14px;line-height:1.9;font-size:14px}
.steps code{background:#eef3ee;padding:2px 8px;border-radius:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.on{display:flex}
.mbox{background:var(--card);border-radius:22px;padding:22px;max-width:380px;width:100%;text-align:center}
.mbox h3{margin-bottom:8px}.mbox p{color:var(--mut);margin-bottom:16px;font-size:14px}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;z-index:60;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}

/* ===== অ্যাপ-স্টাইল কমপ্যাক্ট + ওভারফ্লো ফিক্স ===== */
html,body{overflow-x:hidden;width:100%}
.editor{grid-template-columns:minmax(0,1fr)!important;gap:10px}
.editor>*,.panel,.prev,.f,.row>*{min-width:0}
.scn,.chips,.tb{max-width:100%}
.panel{padding:10px 12px}
.f{margin-bottom:9px}
.f>label{font-size:12px;margin-bottom:3px}
.hint{font-size:11px}
.btn{padding:11px 12px;font-size:14px;border-radius:12px}
.btn.sm{padding:7px 10px;font-size:12px}
.row{gap:8px}
.seg button{padding:8px 4px;font-size:13px}
.sw{width:26px;height:26px}
.tb{gap:6px;margin-top:6px}
.rt{min-height:84px}
.scn button{width:58px}.scn button.none{height:58px}
h2{font-size:16px;margin:2px 0 10px}
header{padding-top:calc(10px + env(safe-area-inset-top));padding-bottom:10px}
header h1{font-size:18px}
.tcard .nm{padding:7px 10px;font-size:13px}
main{padding:12px}
.back{margin-bottom:6px;font-size:14px}
.prev{padding:8px}
#cv{max-height:32vh;max-height:32dvh}
.tabs{display:flex;gap:6px;margin-bottom:10px;background:#eef2ee;padding:4px;border-radius:12px}
.tabs button{flex:1;border:0;background:none;padding:8px 2px;font:inherit;font-size:13px;font-weight:600;color:var(--mut);border-radius:9px;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--g);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.pane{display:none}.pane.on{display:block}
.dl{position:static;clear:both;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.dl .row{display:flex;gap:8px}.dl .btn{flex:1;min-width:0;white-space:nowrap;padding:12px 6px}
nav button{padding:7px 0 6px;font-size:11px}nav button i{font-size:19px}
.hero{background:linear-gradient(135deg,var(--g),var(--g2) 60%,#0a3d26);color:#fff;border-radius:22px;padding:20px 18px;margin-bottom:14px;position:relative;overflow:hidden}

.hero h1{font-size:22px;margin:0 0 4px}.hero p{opacity:.9;font-size:14px;margin:0 0 14px}
.hstats{display:flex;gap:8px}.hstats div{flex:1;background:rgba(255,255,255,.15);border-radius:14px;padding:8px 4px;text-align:center;font-size:12px}.hstats b{display:block;font-size:18px}
.pcover{background:linear-gradient(135deg,var(--g),var(--g2));border-radius:22px;padding:22px 16px 16px;text-align:center;color:#fff;margin-bottom:12px}
.pav{width:84px;height:84px;border-radius:50%;background:var(--card);color:var(--g);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;margin:0 auto 8px;overflow:hidden;border:4px solid rgba(255,255,255,.5)}.pav img{width:100%;height:100%;object-fit:cover}
.pstats{display:flex;gap:8px;margin-bottom:12px}.pstats div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;font-size:12px;color:var(--mut)}.pstats b{display:block;font-size:17px;color:var(--g)}
.plans{display:grid;gap:10px;margin:12px 0}.plan{cursor:pointer;position:relative;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.25);border-radius:16px;padding:12px;text-align:left;color:#fff}.plan.sel{border-color:#ffd86b;background:rgba(255,216,107,.18)}.plan.sel:after{content:'✔';position:absolute;left:10px;bottom:8px;color:#ffd86b;font-weight:800}.plan b{font-size:16px}.plan .pp{float:right;font-size:20px;font-weight:800;color:#ffd86b}.plan small{display:block;opacity:.85;margin-top:4px;line-height:1.5}
.edhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}.edhead .back{margin:0;white-space:nowrap}
.wmnote{font-size:11px;line-height:1.35;padding:6px 10px;border-radius:12px;text-align:right;cursor:pointer;background:#fff4d6;color:#7a5a00;border:1px solid #f0d88a;max-width:62%}.wmnote.ok{background:#e6f6ec;color:#17623a;border-color:#b8e2c8;cursor:default}
.qopt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;margin-bottom:6px;font:inherit;font-size:14px;cursor:pointer}
.ic{width:1.15em;height:1.15em;vertical-align:-.22em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav i{display:block;font-style:normal;margin-bottom:2px}nav i .ic{width:23px;height:23px;vertical-align:0}
.tcard{position:relative}.fav{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#8a8f98;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.18);cursor:pointer;padding:0}.fav.on{color:#e0245e}.fav.on .ic{fill:#e0245e}
.sbox{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:0 12px;margin-bottom:10px;color:var(--mut)}.sbox input{flex:1;border:0;outline:0;background:none;font:inherit;font-size:16px;padding:11px 0;color:var(--tx)}
.adm{display:grid;gap:12px}.ah{display:flex;justify-content:space-between;align-items:center}.ah h2{margin:0;font-size:18px;display:flex;gap:8px;align-items:center}.ah small{color:var(--mut);font-size:11px;display:block;margin-top:2px}.ab button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px;margin-left:6px;color:var(--tx);cursor:pointer;line-height:0}
.live{background:linear-gradient(135deg,#0f6b3a,#0a3d26);color:#fff;border-radius:18px;padding:16px;display:flex;align-items:center;gap:14px}.live b{font-size:36px;line-height:1}.live small{opacity:.85;display:block}.dot{width:12px;height:12px;border-radius:50%;background:#4ade80;animation:pl 1.6s infinite;flex:none}@keyframes pl{0%{box-shadow:0 0 0 0 rgba(74,222,128,.7)}70%,100%{box-shadow:0 0 0 12px rgba(74,222,128,0)}}
.kg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}.kc .ki{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#e8f3ec;color:var(--g);margin-bottom:8px}.kc b{display:block;font-size:22px}.kc small{color:var(--mut);font-size:12px}.up{color:#17803d}.dn{color:#c62828}
.ac{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}.ac h3{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar{height:8px;border-radius:6px;background:#eef2ee;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--g2))}.r2{display:flex;justify-content:space-between;font-size:13px;margin:9px 0 4px}
.evr{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:center}.evr:last-child{border:0}.evr .ei{width:32px;height:32px;border-radius:50%;background:#e8f3ec;color:var(--g);display:flex;align-items:center;justify-content:center;flex:none}.evr small{color:var(--mut)}
.mini{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer;color:var(--tx)}.mini.d{color:#c62828}
*{scrollbar-width:none;-ms-overflow-style:none}*::-webkit-scrollbar{display:none;width:0;height:0}
.pc{position:relative;height:210px;border-radius:20px;overflow:hidden;margin-bottom:12px;background:linear-gradient(135deg,var(--g),var(--g2))}
.pcbg{position:absolute;inset:0;background-size:cover;background-position:center}
.pcbl{position:absolute;left:0;right:0;bottom:0;height:62%;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);-webkit-mask-image:linear-gradient(to bottom,transparent,#000 55%);mask-image:linear-gradient(to bottom,transparent,#000 55%);background:linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,.5))}
.pci{position:absolute;left:14px;right:14px;bottom:14px;display:flex;align-items:center;gap:12px;color:#fff}

.pci b{font-size:17px;display:block;text-shadow:0 1px 4px rgba(0,0,0,.4)}.pci small{opacity:.92;font-size:12px;display:block}
.pcb{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.22);border-radius:20px;padding:2px 9px;font-size:11px;margin-top:4px;backdrop-filter:blur(6px)}
.pcedit{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.4);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(6px)}
.pc{height:auto;aspect-ratio:3/1;width:100%;min-width:0;min-height:0}.pci{bottom:10px}.pci .pav{width:52px;height:52px;font-size:22px}.pcedit{top:8px;right:8px}.pcedit.cam{right:52px}button.pcedit{border:0}

.sgrp{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}.sgrp.nopad{padding:4px 12px}.sl{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin-bottom:10px}

.pg-hero{background:linear-gradient(135deg,#0f6b3a,#0a3d26 70%);color:#fff;border-radius:22px;padding:20px 16px;text-align:center;margin-bottom:12px;position:relative;overflow:hidden}.pg-hero:after{content:'';position:absolute;left:-30px;bottom:-50px;width:150px;height:150px;border-radius:50%;background:rgba(255,216,107,.12)}

function render(canvas,s,outW){
  const H=Math.round(1080*s.ratio),k=outW/1080;canvas.width=outW;canvas.height=Math.round(H*k);
  const c=canvas.getContext('2d');c.setTransform(k,0,0,k,0,0);c.clearRect(0,0,1080,H);
  tplById(s.tpl).draw(c,1080,H,s)}

function curPlan(){let p=LS.get('cs_plan',null);if(!p&&LS.get('cs_pro',false)===true)p={id:'p200',exp:0};if(!p||(p.exp&&Date.now()>p.exp))return null;return p}
const isPro=()=>!!curPlan();
const planDef=()=>{const p=curPlan();return p&&CFG.plans.find(x=>x.id===p.id)};
const isVip=()=>!!(planDef()&&planDef().vip);
let selPlan='p200';const selDef=()=>CFG.plans.find(x=>x.id===selPlan)||CFG.plans[0];
const locked=t=>(t.pro&&!isPro())||(t.vip&&!isVip());
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2200)}
function loadImg(src){return new Promise(r=>{if(!src)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
function coverCrop(file){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const W=1500,H=500,cv=document.createElement('canvas');cv.width=W;cv.height=H;const k=Math.max(W/i.width,H/i.height),w=i.width*k,h=i.height*k;cv.getContext('2d').drawImage(i,(W-w)/2,(H-h)/2,w,h);res(cv.toDataURL('image/jpeg',.82))};i.src=fr.result};fr.readAsDataURL(file)})}
function readFile(file,max,type){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),cv=document.createElement('canvas');cv.width=Math.round(i.width*k);cv.height=Math.round(i.height*k);cv.getContext('2d').drawImage(i,0,0,cv.width,cv.height);res(cv.toDataURL(type,.82))};i.src=fr.result};fr.readAsDataURL(file)})}

function drawGrid(){const g=$('#tgrid');g.innerHTML='';

    d.insertAdjacentHTML('beforeend',`<span class="${locked(t)?'lock':'free'}">${t.vip?ic('crown',13)+' VIP':t.pro?(isPro()?ic('crown',13):ic('lock',13))+' প্রো':'ফ্রি'}</span><div class="nm">${t.name}</div>`);

function watermark(out){
  if(isPro()&&!LS.get('cs_wm',false))return;
  const c=out.getContext('2d'),W=out.width,H=out.height,k=W/1080,T=CFG.watermark||CFG.appName,f=`800 ${44*k}px 'Hind Siguri','Noto Sans Bengali',sans-serif`;
  c.save();c.font=f;c.textAlign='center';c.textBaseline='middle';c.globalAlpha=.17;c.fillStyle='#fff';c.strokeStyle='#000';c.lineWidth=2*k;
  c.translate(W/2,H/2);c.rotate(-.5);let r=0;
  for(let y=-W;y<=W;y+=190*k,r++)for(let x=-W;x<=W;x+=500*k){const xx=x+(r%2?250*k:0);c.strokeText(T,xx,y);c.fillText(T,xx,y)}
  c.restore();
  c.save();c.font=`700 ${26*k}px 'Hind Siguri','Noto Sans Bengali',sans-serif`;const lab='✦ '+T,w=c.measureText(lab).width+34*k;
  c.globalAlpha=.62;c.fillStyle='#000';c.beginPath();c.roundRect(W-w-18*k,18*k,w,50*k,25*k);c.fill();c.globalAlpha=1;c.fillStyle='#fff';c.textAlign='center';c.textBaseline='middle';c.fillText(lab,W-w/2-18*k,43*k);c.restore()}
function download(hd){

  const out=document.createElement('canvas');render(out,S,hd?2160:720);watermark(out);
  out.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`card-${Date.now()}.${hd?'png':'jpg'}`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);notify('download',{id:t.id,tpl:t.name,hd:!!hd,pro:!!t.pro})},hd?'image/png':'image/jpeg',.9);

async function shareCard(){

const ic=(n,z)=>'<svg class="ic" viewBox="0 0 24 24"'+(z?` style="width:${z}px;height:${z}px"`:'')+'>'+IC[n]+'</svg>';
/* ============ গণনা ও অ্যাডমিন প্যানেল (গ্রাহকের অনুমতি সহ) ============ */
const dbOn=()=>!!CFG.dbUrl;
const dbu=p=>CFG.dbUrl.replace(/\/$/,'')+'/'+p+'.json';
const dbPut=(p,v)=>fetch(dbu(p),{method:'PUT',body:JSON.stringify(v)}).catch(()=>{});
const dbGet=(p,q)=>fetch(dbu(p)+(q||'')).then(r=>r.json()).catch(()=>null);
const INC={'.sv':{increment:1}};
const hx=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dayKey=(d=Date.now())=>new Date(d+6*36e5).toISOString().slice(0,10); // বাংলাদেশ সময়
const isAdmin=()=>LS.get('cs_admin',false)===true;
function consent(){return LS.get('cs_notify','')}
function vid(){let v=LS.get('cs_vid','');if(!v){v='v'+Math.random().toString(36).slice(2,9);LS.set('cs_vid',v)}return v}
function canTrack(){return dbOn()&&consent()==='yes'&&!isAdmin()}
function notify(type,d){
  if(!canTrack())return;d=d||{};
  try{
    if(type==='visit'){
      if(sessionStorage.getItem('cs_seen'))return;sessionStorage.setItem('cs_seen','1');
      const day=dayKey();
      dbPut('stats/total',INC);dbPut('stats/days/'+day,INC);
      dbPut('uniq/'+vid(),true);dbPut('dayuniq/'+day+'/'+vid(),true);
    }else if(type==='download'){
      dbPut('stats/'+(d.hd?'dlHD':'dlNormal'),INC);
      const id=String(d.id||'x').replace(/[^\w-]/g,'_');
      dbPut('stats/tpl/'+id,INC);dbPut('stats/tplname/'+id,d.tpl||id);logEvent(d);
    }else if(type==='pro_on')dbPut('stats/proOn',INC);
    else if(type==='pro_off')dbPut('stats/proOff',INC);
  }catch(e){}
}
function logEvent(d){
  const b={t:Date.now(),tpl:d.tpl||'',hd:d.hd?1:0,dev:/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent)?'মোবাইল':'ডেস্কটপ'};
  const send=l=>fetch(dbu('events'),{method:'POST',body:JSON.stringify(l?{...b,lat:l[0],lon:l[1]}:b)}).catch(()=>{});
  if(!navigator.geolocation)return send();
  navigator.geolocation.getCurrentPosition(p=>send([+p.coords.latitude.toFixed(1),+p.coords.longitude.toFixed(1)]),()=>send(),{timeout:8000,maximumAge:6e5})
}
let presenceOn=false;
function startPresence(){
  if(presenceOn||!canTrack())return;presenceOn=true;
  const ping=()=>{if(canTrack())dbPut('online/'+vid(),{t:Date.now()})};
  ping();setInterval(()=>{if(!document.hidden)ping()},25000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)ping()});
  window.addEventListener('pagehide',()=>{try{fetch(dbu('online/'+vid()),{method:'DELETE',keepalive:true})}catch(e){}});
}
function initPrivacy(){
  if(!dbOn()||location.hash==='#admin')return;
  const set=v=>{LS.set('cs_notify',v);$('#privM').classList.remove('on');if(v==='yes'){notify('visit');startPresence()}};
  $('#privYes').onclick=()=>set('yes');$('#privNo').onclick=()=>set('no');
  if(!consent())$('#privM').classList.add('on');else{notify('visit');startPresence()}
}
function addPrivacy(){return}
function addPrivacyOld(){
  if(!dbOn())return;
  const on=consent()==='yes',v=$('#v-prof');
  v.insertAdjacentHTML('beforeend',`<div class="panel" style="margin-top:12px"><b>${ic('bell',16)} গোপনীয়তা</b><p class="hint" style="margin:6px 0 10px">অ্যাপের মালিক শুধু সংখ্যা দেখতে পান: কতজন ঢুকেছে, কতজন অনলাইনে আছে, কোন টেমপ্লেট কতবার ডাউনলোড হয়েছে। নাম, ফোন নম্বর, কার্ডের লেখা বা ছবি পাঠানো হয় না। ডাউনলোডের সময় ব্রাউজার লোকেশনের অনুমতি চাইতে পারে; অনুমতি দিলে শুধু আনুমানিক এলাকা (প্রায় ১১ কিমি) জানা যায়, না দিলে কিছুই যায় না।<br>বর্তমান অবস্থা: <b>${on?'চালু':'বন্ধ'}</b></p><button class="btn o" id="privTg">${on?'গণনা বন্ধ করুন':'গণনা চালু করুন'}</button></div>`);
  $('#privTg').onclick=()=>{LS.set('cs_notify',on?'no':'yes');if(!on){notify('visit');startPresence()}toast(on?'বন্ধ করা হয়েছে':'চালু করা হয়েছে');go('prof')}
}

function exportEvents(evs){
  const rows=[['সময়','টেমপ্লেট','কোয়ালিটি','ডিভাইস','অক্ষাংশ','দ্রাঘিমাংশ']].concat(evs.map(e=>[new Date(e.t).toISOString(),e.tpl,e.hd?'HD':'Normal',e.dev,e.lat??'',e.lon??'']));
  const csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='downloads-'+dayKey()+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000)}

function drawInfo(){
  const k=infoKey,T={privacy:L('প্রাইভেসি পলিসি','Privacy Policy'),contact:L('যোগাযোগ','Contact'),about:L('অ্যাপ সম্পর্কে','About')}[k];let h='';
  if(k==='privacy')h=L(`<h3>আপনার কার্ড</h3><p>কার্ড আপনার ফোনেই তৈরি হয়। আপনার লেখা, ছবি বা লোগো কোনো সার্ভারে আপলোড হয় না।</p><h3>ফোনে সেভ থাকে যা</h3><p>প্রোফাইলের তথ্য (নাম, ট্যাগ, ফোন, লোগো, কভার ফটো), হিস্টরি, ফেভারিট, প্ল্যান, ভাষা ও থিম আপনার ব্রাউজারের লোকাল স্টোরেজে থাকে। ব্রাউজারের ডেটা মুছলে এগুলোও মুছে যায়।</p><h3>পরিসংখ্যান</h3><p>আপনি অনুমতি দিলে শুধু নামহীন সংখ্যা জমা হয়: ভিজিট, কোন টেমপ্লেট ডাউনলোড হয়েছে, নরমাল/HD, ডিভাইসের ধরন ও একটি এলোমেলো আইডি। নাম, ফোন নম্বর, কার্ডের লেখা বা ছবি পাঠানো হয় না।</p><h3>লোকেশন</h3><p>ডাউনলোডের সময় ব্রাউজার অনুমতি চাইলে এবং আপনি দিলে শুধু আনুমানিক এলাকা (প্রায় ১১ কিমি) জানা যায়। না দিলে কিছুই যায় না।</p><h3>তৃতীয় পক্ষ</h3><p>সংখ্যাগুলো Google Firebase-এ জমা হয়। ফন্ট Google Fonts থেকে আসে।</p><h3>আপনার নিয়ন্ত্রণ</h3><p>সেটিংস থেকে পরিসংখ্যান যেকোনো সময় বন্ধ করতে পারবেন।</p>`,`<h3>Your cards</h3><p>Cards are created on your phone. Your text, photos or logo are never uploaded to any server.</p><h3>Saved on your device</h3><p>Profile details (name, tag, phone, logo, cover photo), history, favorites, plan, language and theme are kept in your browser's local storage. Clearing browser data removes them.</p><h3>Statistics</h3><p>If you allow it, only anonymous numbers are stored: visits, which template was downloaded, normal/HD, device type and a random ID. No name, phone number, card text or photo is sent.</p><h3>Location</h3><p>If your browser asks on download and you allow it, only an approximate area (about 11 km) is known. If you decline, nothing is sent.</p><h3>Third parties</h3><p>Counts are stored in Google Firebase. Fonts are loaded from Google Fonts.</p><h3>Your control</h3><p>You can turn statistics off any time in Settings.</p>`);

  if(k==='contact'){const b=(href,i,t)=>`<a class="btn${i==='phone'?'':' o'}" style="display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;margin-bottom:10px" href="${href}" target="_blank" rel="noopener">${ic(i,18)} ${t}</a>`;

  $('#v-info').innerHTML=`<div class="edhead"><button class="back" id="iBack">${ic('back')} ${L('সেটিংস','Settings')}</button></div><h2>${T}</h2><div class="ibox">${h}</div>`;

      if(t>=cl.e||v.ended||performance.now()-t0>(cl.e-cl.s+8)*1000)res();else requestAnimationFrame(f)};f()});

    if(record){await new Promise(r=>{rec.onstop=r;rec.stop()});const ext=mime.includes('mp4')?'mp4':'webm',a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:mime||'video/webm'}));a.download='reel-'+(i+1)+'.'+ext;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);rlSt('✔ ক্লিপ '+(i+1)+' ডাউনলোড হয়েছে')}else rlSt('')
  }catch(e){rlSt('সমস্যা: '+e.message)}
  RL.busy=false}
function drawClips(){
  const b=$('#rlClips');b.innerHTML=RL.clips.map((c,i)=>`<div class="clip"><b>ক্লিপ ${i+1} • ${fmtT(c.s)}–${fmtT(c.e)}</b><button class="mini" data-p="${i}">প্রিভিউ</button><button class="mini" data-d="${i}">${ic('download',13)} ডাউনলোড</button></div>`).join('')+`<button class="btn o" id="rlAll" style="margin-top:4px">সব ক্লিপ একে একে ডাউনলোড</button>`;
  $$('#rlClips [data-p]').forEach(x=>x.onclick=()=>runClip(+x.dataset.p,false));$$('#rlClips [data-d]').forEach(x=>x.onclick=()=>runClip(+x.dataset.d,true));
  $('#rlAll').onclick=async()=>{for(let i=0;i<RL.clips.length;i++){await runClip(i,true)}}}
function drawReel(){
  const v=$('#v-reel');if(v.dataset.ready)return;v.dataset.ready='1';
  v.innerHTML=`<h2>${ic('film',20)} রিলস স্টুডিও</h2>
  <div class="steps" style="margin-bottom:12px"><b>কিভাবে কাজ করে:</b> লম্বা ভিডিও দিন → ২০/২৫/৩০ সেকেন্ডের ক্লিপে নিজে কাটবে → ক্যাপশন দিলে স্টাইলিশ শব্দ-বাই-শব্দ ভেসে উঠবে (রঙিন ব্যাকগ্রাউন্ডসহ) → ক্লিপ ডাউনলোড।</div>
  <div class="panel"><label class="file"><input type="file" accept="video/*" id="rlFile"><span class="btn" style="display:block;text-align:center">${ic('film',17)} ভিডিও বাছুন (গ্যালারি থেকে)</span></label><p class="hint" id="rlInfo" style="margin-top:8px">এখনো ভিডিও বাছা হয়নি।</p>
  <video id="rlVid" playsinline preload="auto" style="position:absolute;width:2px;height:2px;opacity:.01;pointer-events:none"></video>
  <div class="f" style="margin-top:12px"><label>ক্লিপের দৈর্ঘ্য</label><div class="seg" id="rlLen"><button data-v="20">২০ সেকেন্ড</button><button data-v="25">২৫ সেকেন্ড</button><button data-v="30">৩০ সেকেন্ড</button></div></div>
  <div class="f"><label>ক্যাপশন স্টাইল</label><div class="seg" id="rlStyle"><button data-v="neon">নিয়ন</button><button data-v="gold">গোল্ড</button><button data-v="pop">পপ</button><button data-v="clean">ক্লিন</button></div></div>
  <div class="f"><label>ক্যাপশনের জায়গা</label><div class="seg" id="rlPos"><button data-v="bottom">নিচে</button><button data-v="mid">মাঝখানে</button></div></div>
  <div class="f"><label>ক্যাপশন / ট্রান্সক্রিপ্ট</label><textarea id="rlTxt" rows="4" placeholder="এখানে .srt/.vtt টেক্সট পেস্ট করুন, অথবা সাধারণ লেখা দিন (সময় ছাড়া দিলে পুরো ভিডিওতে সমানভাবে ভাগ হবে)"></textarea><label class="file" style="margin-top:6px"><input type="file" accept=".srt,.vtt,.txt" id="rlSub"><span class="btn o sm">সাবটাইটেল ফাইল (.srt / .vtt)</span></label></div>
  <button class="btn" id="rlBuild">${ic('sparkle',17)} ক্লিপ বানান</button></div>
  <div id="rlClips" style="margin-top:12px"></div><canvas id="rlCv" width="360" height="640"></canvas><div class="rlst" id="rlSt"></div>
  <div class="steps"><b>${ic('info',15)} লিংক থেকে কাটা যায় না কেন?</b><br>ইউটিউব, টিকটক, ফেসবুক বা ইনস্টাগ্রামের লিংক থেকে ভিডিও নামানো ব্রাউজারের ভেতরে সম্ভব নয় (ওই সাইটগুলো তা আটকে রাখে), আর অন্যের ভিডিও কপিরাইটের আওতায় পড়ে। তাই নিজের ভিডিও ফাইল গ্যালারি থেকে দিন।<br><br><b>স্বয়ংক্রিয় ক্যাপশন:</b> এখনো নেই। .srt/.vtt ফাইল বা লেখা দিন। প্রতিটি ক্লিপ ক্লিপের সমান সময় ধরে রেন্ডার হয় এবং ক্রোমে সবচেয়ে ভালো চলে।${isPro()?'':'<br><br>ফ্রিতে ক্লিপে ওয়াটারমার্ক থাকে, প্রো-তে থাকে না।'}</div>`;
  segG('rlLen',()=>RL.len,x=>{RL.len=+x;if(RL.dur){buildClips();drawClips()}});segG('rlStyle',()=>RL.style,x=>RL.style=x);segG('rlPos',()=>RL.pos,x=>RL.pos=x);
  $('#rlFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const vid=$('#rlVid');if(RL.url)URL.revokeObjectURL(RL.url);RL.url=URL.createObjectURL(f);vid.src=RL.url;
    vid.onloadedmetadata=()=>{RL.dur=vid.duration;$('#rlInfo').textContent=f.name+' • '+fmtT(RL.dur)+' মিনিট';buildClips();drawClips();vid.currentTime=0.1}};
  $('#rlSub').onchange=async e=>{const f=e.target.files[0];if(f){$('#rlTxt').value=await f.text();toast('ক্যাপশন যোগ হয়েছে')}};
  $('#rlBuild').onclick=()=>{if(!RL.dur)return toast('আগে ভিডিও বাছুন');buildClips();drawClips();toast(RL.clips.length+'টি ক্লিপ তৈরি')}}
